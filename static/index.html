<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAVE MÉXICO AYUDAR</title>
<style>
:root{--bg:#080b12;--card:#111722;--card2:#171e2b;--line:#283242;--text:#f5f7fa;--muted:#9da8b8;--accent:#38bdf8;--ok:#22c55e;--warn:#f59e0b;--danger:#ef4444}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
body{min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px}
.logo small{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:3px}
.lang{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 13px}
.screen{display:none}
.screen.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:14px}
h1,h2,h3{margin:0 0 10px;line-height:1.25}
h1{font-size:28px}
h2{font-size:22px}
p{line-height:1.55}
.muted{color:var(--muted)}
.small{font-size:13px}
.notice{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;line-height:1.5;margin:12px 0}
.notice.warning{border-color:#6b4c12}
.notice.danger{border-color:#6b2020}
.notice.ok{border-color:#176631}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.primary,.secondary,.dangerBtn{border:0;border-radius:11px;padding:12px 17px;font-weight:700}
.primary{background:var(--accent);color:#03131b}
.secondary{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.dangerBtn{background:var(--danger);color:white}
.choice{width:100%;display:block;text-align:left;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:16px;margin:9px 0}
.choice:hover{border-color:var(--accent)}
.choice strong{display:block;font-size:16px}
.choice small{display:block;color:var(--muted);margin-top:5px;line-height:1.4}
.option-list{display:grid;gap:10px}
.option{display:block;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.4}
.option input{margin-right:8px}
.field{margin:12px 0}
.field label{display:block;margin-bottom:7px;font-weight:700}
.field input,.field textarea{width:100%;background:#0b1018;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:12px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{min-height:120px;resize:vertical}
.hidden{display:none!important}
.progress{height:5px;background:#1b2330;border-radius:20px;overflow:hidden;margin-bottom:18px}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.step{color:var(--accent);font-size:12px;font-weight:700;margin-bottom:7px;text-transform:uppercase}
.doc{border:1px solid var(--line);background:var(--card2);border-radius:13px;padding:14px;margin:10px 0}
.doc-name b{display:block}
.doc-status{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.doc-status button{border:1px solid var(--line);background:#0b1018;color:var(--text);border-radius:8px;padding:9px 5px;font-size:12px}
.doc-status button.active.have{border-color:var(--ok);background:#10331c}
.doc-status button.active.missing{border-color:var(--danger);background:#351619}
.doc-status button.active.unsure{border-color:var(--warn);background:#34280e}
.doc-status button.active.na{border-color:#789; background:#202936}
.summary{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;line-height:1.6}
.summary>b{display:block;color:var(--accent);margin-bottom:7px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:3px 7px;font-size:12px}
.loading{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:20}
.loadingBox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#171e2b;border:1px solid var(--line);color:var(--text);padding:12px 16px;border-radius:10px;display:none;z-index:30;max-width:90%;text-align:center}
@media(max-width:560px){
 .app{padding:12px}
 .card{padding:17px}
 h1{font-size:24px}
 .doc-status{grid-template-columns:repeat(2,1fr)}
 .actions button{width:100%}
}
</style>

function $(id){return document.getElementById(id)}
function esc(v){
 return String(v===undefined||v===null?"":v)
 .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function t(k){return (TEXT[state.lang]&&TEXT[state.lang][k])||TEXT.es[k]||k}
function loading(v,text){
 $("loading").style.display=v?"flex":"none";
 if(text)$("loadingText").textContent=text;
}
function toast(text){
 $("toast").textContent=text;
 $("toast").style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>{$("toast").style.display="none"},3200);
}
async function api(url,opt={}){
 const r=await fetch(url,opt);
 let d={};
 try{d=await r.json()}catch(e){}
 if(!r.ok)throw new Error(d.detail||d.error||t("invalid"));
 return d;
}

function updateLanguage(){
 document.documentElement.lang=state.lang;
 $("langBtn").textContent=state.lang==="es"?"EN":"ES";
 setText("introText","intro");setText("introNotice","introNotice");setText("startBtn","start");
 $("legalNotice").innerHTML="<b>"+esc(t("legalTitle"))+"</b><br>"+esc(t("legal"));
 setText("accessTitle","access");setText("accessHelp","accessHelp");
 setText("individualTitle","individual");setText("individualText","individualText");
 setText("monthlyTitle","monthly");setText("monthlyText","monthlyText");
 setText("annualTitle","annual");setText("annualText","annualText");
 setText("adminTitle","admin");setText("adminText","adminText");
 setText("userLabel","user");setText("passLabel","pass");setText("adminBtn","adminBtn");
 setText("stripeNotice","stripe");setText("tramiteTitle","tramite");setText("tramiteHelp","tramiteHelp");
 setText("modalidadTitle","modality");setText("modalidadHelp","modalityHelp");
 setText("documentsTitle","documents");setText("documentsHelp","documentsHelp");
 setText("documentsNotice","documentsNotice");setText("personalTitle","personal");
 setText("personalHelp","personalHelp");setText("reviewTitle","review");setText("reviewHelp","reviewHelp");
 setText("readyTitle","ready");setText("readyText","readyText");setText("readyNotice","readyNotice");
 setText("backAccessBtn","back");setText("backTramiteBtn","back");setText("questionBackBtn","back");
 setText("backQuestionsBtn","back");setText("backDocumentsBtn","back");setText("backPersonalBtn","back");
 setText("documentsNextBtn","continue");setText("pdfBtn","generate");setText("downloadBtn","download");
 setText("newBtn","new");setText("logoutBtn","logout");setText("backModalidadBtn","back");
 $("personalNextBtn").textContent=t("next");
 updateSteps();
}
function setText(id,key){const el=$(id);if(el)el.textContent=t(key)}
function updateSteps(){
 for(let i=1;i<=7;i++){
  const el=$("step"+i);
  if(el)el.textContent=t("step")+" "+i+" "+t("of")+" 7";
 }
}

function go(n){
 document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));
 const screen=$("s"+n);
 if(!screen)return;
 screen.classList.add("active");
 $("progressBar").style.width=Math.min(100,(Math.max(0,n-1)/7)*100)+"%";
 window.scrollTo({top:0,behavior:"smooth"});
 if(n===2)loadTramites();
 if(n===3)loadModalidades();
 if(n===4)renderPregunta();
 if(n===5)renderDocs();
 if(n===6)renderPersonal();
 if(n===7)renderReview();
}

function toggleLang(){
 state.lang=state.lang==="es"?"en":"es";
 updateLanguage();
 const active=document.querySelector(".screen.active");
 if(active){
  const id=active.id;
  if(id==="s2")loadTramites();
  if(id==="s3")loadModalidades();
  if(id==="s4")renderPregunta();
  if(id==="s5")renderDocs();
  if(id==="s6")renderPersonal();
  if(id==="s7")renderReview();
 }
 toast(state.lang==="es"?"Español seleccionado":"English selected");
}

async function checkAccess(){
 try{
  const d=await api("/api/check-access");
  state.access=!!d.access;
  state.admin=!!d.admin;
  if(state.access)go(2);
 }catch(e){}
}

async function adminLogin(){
 const username=$("adminUser").value.trim();
 const password=$("adminPass").value;
 if(!username||!password){
  toast(state.lang==="es"?"Escribe usuario y contraseña.":"Enter username and password.");
  return;
 }
 loading(true,t("checking"));
 try{
  const d=await api("/api/admin-login",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({username,password})
  });
  state.access=true;state.admin=true;
  toast(d.message||t("authorized"));
  go(2);
 }catch(e){toast(e.message)}
 finally{loading(false)}
}

async function checkout(plan){
 if(["daily","monthly","annual"].indexOf(plan)<0){toast(t("invalid"));return}
 loading(true,t("payment"));
 try{
  const d=await api("/api/create-checkout-session",{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({plan})
  });
  if(d.url){location.href=d.url;return}
  if(d.checkout_url){location.href=d.checkout_url;return}
  throw new Error("Stripe no devolvió una sesión de pago.");
 }catch(e){toast(e.message);loading(false)}
}

async function verifyPayment(){
 const p=new URLSearchParams(location.search);
 const session=p.get("session_id")||p.get("checkout_session_id");
 if(!session)return;
 loading(true,t("paymentCheck"));
 try{

function normalizeQuestionType(type){
 const x=String(type||"").toLowerCase();
 if(["si_no","yes_no","boolean"].includes(x))return"si_no";
 if(["opciones","options","single","select"].includes(x))return"opciones";
 if(["multiple","multi_select"].includes(x))return"multiple";
 if(["fecha","date"].includes(x))return"fecha";
 if(["numero","number"].includes(x))return"numero";
 if(x==="email")return"email";
 if(["textarea","texto_largo"].includes(x))return"textarea";
 return"texto";
}

function conditionMatch(condition){
 if(!condition)return true;
 if(typeof condition!=="object")return true;
 const key=condition.pregunta||condition.id||condition.campo||condition.depende_de;
 if(!key)return true;
 const actual=state.respuestas[key];
 if(condition.valor!==undefined)return valueMatch(actual,condition.valor);
 if(condition.valores!==undefined)return condition.valores.some(v=>valueMatch(actual,v));
 if(condition.no_es!==undefined)return !valueMatch(actual,condition.no_es);
 return true;
}
function valueMatch(actual,expected){
 if(Array.isArray(actual))return actual.some(x=>String(x)===String(expected));
 return String(actual??"")===String(expected??"");
}
function questionVisible(q){
 if(!q)return false;
 if(q.visible_si&& !conditionMatch(q.visible_si))return false;
 if(q.condicion&& !conditionMatch(q.condicion))return false;
 if(q.depende_de&&q.valor!==undefined&&!valueMatch(state.respuestas[q.depende_de],q.valor))return false;
 return true;
}
function visibleQuestions(){
 return state.preguntas.filter(questionVisible);
}
function syncQuestionIndex(){
 const list=visibleQuestions();
 if(!list.length)return;
 if(state.preguntaIndex>=list.length)state.preguntaIndex=list.length-1;
}
function currentQuestion(){
 const list=visibleQuestions();
 syncQuestionIndex();
 return list[state.preguntaIndex]||null;
}

function renderPregunta(){
 const q=currentQuestion();
 const box=$("preguntaBox");
 if(!q){go(5);return}
 const list=visibleQuestions();
 $("step3").textContent=t("step")+" 3 "+t("of")+" 7";
 $("preguntaTitle").textContent=localizedValue(q.texto)||localizedValue(q.pregunta)||localizedValue(q.title)||t("answer");
 $("preguntaHelp").textContent=(state.lang==="es"?"Pregunta ":"Question ")+(state.preguntaIndex+1)+" "+t("of")+" "+list.length;
 box.innerHTML="";
 const type=normalizeQuestionType(q.tipo||q.type);
 const saved=state.respuestas[q.id];

 if(type==="si_no"){
  const options=[["SI",t("yes")],["NO",t("no")]];
  if(q.permite_no_se!==false)options.push(["NO_SE",state.lang==="es"?"No sé":"I don't know"]);
  box.innerHTML="<div class='option-list'>"+options.map(o=>
   "<label class='option'><input type='radio' name='q' value='"+o[0]+"'> "+esc(o[1])+"</label>"
  ).join("")+"</div>";
  if(saved)document.querySelector("input[name='q'][value='"+CSS.escape(String(saved))+"']")?.setAttribute("checked","checked");
 }else if(type==="opciones"){
  let options=Array.isArray(q.opciones||q.options)?(q.opciones||q.options):[];
  let html="<div class='option-list'>";
  options.forEach(opt=>{
   const value=typeof opt==="string"?opt:(opt&&opt.valor!==undefined?opt.valor:(opt&&opt.id!==undefined?opt.id:""));
   const name=typeof opt==="string"?opt:(opt&&opt.nombre!==undefined?opt.nombre:value);
   if(value!=="")html+="<label class='option'><input type='radio' name='q' value='"+esc(value)+"'> "+esc(localizedValue(name))+"</label>";
  });
  if(q.permite_no_se===true)html+="<label class='option'><input type='radio' name='q' value='NO_SE'> "+esc(state.lang==="es"?"No sé":"I don't know")+"</label>";
  if(q.permite_otro!==false)html+="<label class='option'><input type='radio' name='q' value='OTRO' id='otherRadio'> "+esc(t("other"))+"</label><div id='otherField' class='field hidden'><label>"+esc(t("specify"))+"</label><input id='otherInput' placeholder='"+esc(t("otherPlaceholder"))+"'></div>";
  html+="</div>";
  box.innerHTML=html;
  document.querySelectorAll("input[name='q']").forEach(r=>r.addEventListener("change",()=>{
   $("otherField")?.classList.toggle("hidden",r.value!=="OTRO");
  }));
  if(saved!==undefined&&saved!==null){
   const radio=document.querySelector("input[name='q'][value='"+CSS.escape(String(saved))+"']");
   if(radio)radio.checked=true;
   else if(q.permite_otro!==false){
    const o=$("otherRadio");if(o)o.checked=true;
    $("otherField")?.classList.remove("hidden");
    if($("otherInput"))$("otherInput").value=String(saved);
   }
  }
 }else if(type==="multiple"){
  const options=Array.isArray(q.opciones||q.options)?(q.opciones||q.options):[];
  const savedArray=Array.isArray(saved)?saved:[];
  let html="<div class='option-list'>";
  options.forEach(opt=>{
   const value=typeof opt==="string"?opt:(opt&&opt.valor!==undefined?opt.valor:(opt&&opt.id!==undefined?opt.id:""));
   const name=typeof opt==="string"?opt:(opt&&opt.nombre!==undefined?opt.nombre:value);
   if(value!=="")html+="<label class='option'><input type='checkbox' name='qmulti' value='"+esc(value)+"'> "+esc(localizedValue(name))+"</label>";
  });
  if(q.permite_no_se===true)html+="<label class='option'><input type='checkbox' name='qmulti' value='NO_SE'> "+esc(state.lang==="es"?"No sé":"I don't know")+"</label>";
  if(q.permite_otro!==false)html+="<div class='field'><label>"+esc(t("other"))+"</label><input id='multiOther' placeholder='"+esc(t("otherPlaceholder"))+"'></div>";
  html+="</div>";
  box.innerHTML=html;
  document.querySelectorAll("input[name='qmulti']").forEach(r=>{if(savedArray.map(String).includes(String(r.value)))r.checked=true});
  if($("multiOther")){
   const known=options.map(opt=>String(typeof opt==="string"?opt:(opt&&opt.valor!==undefined?opt.valor:(opt&&opt.id!==undefined?opt.id:""))));
   $("multiOther").value=savedArray.filter(x=>!known.includes(String(x))&&String(x)!=="NO_SE").join(", ");
  }
 }else{
  const inputType=type==="numero"?"number":type==="fecha"?"date":type==="email"?"email":"text";
  const old=saved===undefined||saved===null?"":String(saved);
  box.innerHTML="<div class='field'>"+(type==="textarea"?
   "<textarea id='qInput' placeholder='"+esc(t("otherPlaceholder"))+"'>"+esc(old)+"</textarea>":
   "<input id='qInput' type='"+inputType+"' autocomplete='off' value='"+esc(old)+"'>")+"</div>";
 }
 const last=state.preguntaIndex===list.length-1;
 $("preguntaNext").textContent=last?t("continue"):t("next");
}

function getPreguntaValue(){
 const q=currentQuestion();
 if(!q)return null;
 const type=normalizeQuestionType(q.tipo||q.type);
 if(type==="si_no"||type==="opciones"){
  const r=document.querySelector("input[name='q']:checked");
  if(!r)return"";
  if(r.value==="OTRO")return $("otherInput")?.value.trim()||"";
  return r.value;
 }
 if(type==="multiple"){
  const values=[];
  document.querySelectorAll("input[name='qmulti']:checked").forEach(r=>values.push(r.value));
  const other=$("multiOther")?.value.trim();
  if(other)values.push(other);
  return values;
 }
 return $("qInput")?.value.trim()||"";
}

function preguntaNext(){
 const q=currentQuestion();
 if(!q){go(5);return}
 const v=getPreguntaValue();
 const type=normalizeQuestionType(q.tipo||q.type);
 const empty=Array.isArray(v)?v.length===0:(!v&&v!==0);

 if(q.obligatoria===true&&empty){toast(t("required"));return}
 if((q.permite_otro!==false)&&type==="opciones"){
  const selected=document.querySelector("input[name='q']:checked");
  if(selected&&selected.value==="OTRO"&&!v){toast(t("choose"));$("otherInput")?.focus();return}
 }
 if(type==="multiple"&&q.permite_otro!==false&&Array.isArray(v)){
  const hasOther=v.some(x=>!String(x).trim()||String(x)==="OTRO");
  if(hasOther){toast(t("choose"));return}
 }
 state.respuestas[q.id]=v;
 const list=visibleQuestions();
 if(state.preguntaIndex<list.length-1){
  state.preguntaIndex++;
  renderPregunta();
 }else go(5);
}
function preguntaBack(){
 if(state.preguntaIndex>0){state.preguntaIndex--;renderPregunta()}
 else go(3);
}

function docRequired(doc){

 return true;
}

function caseStatus(){

async function generatePDF(){
 const status=caseStatus();
 renderReview();
 loading(true,state.lang==="es"?"Generando tu guía PDF...":"Generating your PDF guide...");
 try{
  const payload={
   tramite:state.tramite,
   modalidad:state.modalidad,
   datos_personales:state.personal,
   datos_especificos:state.respuestas,
   documentos:state.documentos.map((doc,i)=>({
    id:doc.id||doc.codigo||("d"+i),
    nombre:docName(doc),
    estado:state.docEstados["d"+i]||""
   })),
   documentos_disponibles:(state.documentos||[]).filter((_,i)=>state.docEstados["d"+i]==="have").map(docName),
   documentos_faltantes:(state.documentos||[]).filter((_,i)=>state.docEstados["d"+i]==="missing").map(docName),
   documentos_dudosos:(state.documentos||[]).filter((_,i)=>state.docEstados["d"+i]==="unsure").map(docName),
   documentos_no_aplican:(state.documentos||[]).filter((_,i)=>state.docEstados["d"+i]==="na").map(docName),
   estado_revision:status,
   idioma:state.lang
  };
  const d=await api("/api/generar-guia-consular",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify(payload)
  });
  state.pdf=d.filename||d.file||d.pdf||"";
  if(!state.pdf)throw new Error(t("noPdf"));
  let info="<div class='summary'><b>"+esc(t("tramite"))+"</b>"+esc(getTramiteName())+"</div>"+
   "<div class='summary'><b>"+esc(t("modality"))+"</b>"+esc(getModalidadName())+"</div>"+

   "<p class='muted small'>"+esc(t("prepared"))+"</p>";
  $("pdfInfo").innerHTML=info;
  $("downloadBtn").onclick=()=>downloadPDF(state.pdf);
  go(8);
 }catch(e){toast(e.message)}
 finally{loading(false)}
}
